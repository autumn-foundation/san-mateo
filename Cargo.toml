[workspace]
members = ["crates/san-mateo"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.89"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/autumn-foundation/san-mateo"

[workspace.dependencies]
san-mateo = { version = "0.1.0", path = "crates/san-mateo" }
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json", "query", "form", "tokio", "http1", "http2"] }
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
percent-encoding = "2"
proptest = "1"
rand = "0.8"
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4", "v5", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# `pub(crate)` marks crate-internal items on purpose.
redundant_pub_crate = "allow"
# Names such as `san_mateo::store::Store` are clear in this crate.
module_name_repetitions = "allow"
