name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Each week, the examples run with the newest compatible dependencies.
  # That finds rot from new upstream releases.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.99.0

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Docs build with no warnings
        run: cargo doc --workspace --no-deps --lib --examples
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    needs: clippy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sm
          POSTGRES_PASSWORD: sm
          POSTGRES_DB: sm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sm -d sm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The Postgres tests run only when this is set.
      SAN_MATEO_TEST_DATABASE_URL: postgres://sm:sm@127.0.0.1:5432/sm_test
      # The full Nango catalog at a fixed commit, for the AC1 parse test. CI
      # reads it. The repo does not hold a copy (ADR 0001).
      NANGO_REV: bd2d9111d640c799cce54e2768dc3b1ef14a00a9
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Get the Nango catalog
        run: |
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/nango-providers.yaml" \
            "https://raw.githubusercontent.com/NangoHQ/nango/$NANGO_REV/packages/providers/providers.yaml"
          echo "SAN_MATEO_NANGO_PROVIDERS=$RUNNER_TEMP/nango-providers.yaml" >> "$GITHUB_ENV"
      - name: Test with coverage (fail under 85% lines)
        run: cargo llvm-cov --workspace --all-targets --fail-under-lines 85 --lcov --output-path lcov.info
      - name: Doc tests
        run: cargo test --workspace --doc
      - uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  # Runs each example in the main workspace as a user does. Each example
  # checks its result and exits with an error when it is wrong.
  examples:
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sm
          POSTGRES_PASSWORD: sm
          POSTGRES_DB: sm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sm -d sm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sm:sm@127.0.0.1:5432/sm_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
      - name: Newest compatible dependencies (weekly run only)
        if: github.event_name == 'schedule'
        run: cargo update
      - name: Build the examples
        run: |
          cargo build --locked -p san-mateo --example embedded \
            -p autumn-plugin-san-mateo --example autumn_app \
            -p san-mateo-harvest --example harvest_workflow
      - name: "example: embedded"
        run: cargo run --locked -p san-mateo --example embedded
      - name: "example: autumn_app (boot, dev and prod, SIGTERM)"
        run: bash scripts/smoke-autumn-example.sh
      - name: "example: harvest_workflow"
        run: cargo run --locked -p san-mateo-harvest --example harvest_workflow
      - name: "example: harvest_workflow, two runs at the same time"
        run: |
          bin=target/debug/examples/harvest_workflow
          "$bin" > a.log 2>&1 & a=$!
          "$bin" > b.log 2>&1 & b=$!
          ra=0; wait "$a" || ra=$?
          rb=0; wait "$b" || rb=$?
          cat a.log b.log
          test "$ra" -eq 0 && test "$rb" -eq 0
      - name: Shell scripts
        run: shellcheck scripts/*.sh

  # The harvest-camel example is a separate workspace (ADR 0006). The root
  # jobs do not see it, so this job has its own gates.
  example-harvest-camel:
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sm
          POSTGRES_PASSWORD: sm
          POSTGRES_DB: sm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sm -d sm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sm:sm@127.0.0.1:5432/sm_test
      SAN_MATEO_TEST_DATABASE_URL: postgres://sm:sm@127.0.0.1:5432/sm_test
      MANIFEST: examples/harvest-camel/Cargo.toml
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/harvest-camel -> target
          key: harvest-camel
      - name: Newest compatible dependencies (weekly run only)
        if: github.event_name == 'schedule'
        run: cargo update --manifest-path "$MANIFEST"
      - name: The lock file is up to date
        run: |
          if ! cargo metadata --locked --format-version 1 --manifest-path "$MANIFEST" > /dev/null; then
            echo "::error::examples/harvest-camel/Cargo.lock is out of date. Run: cargo update --manifest-path $MANIFEST -p san-mateo -p san-mateo-camel"
            exit 1
          fi
      - run: cargo fmt --manifest-path "$MANIFEST" --check
      - run: cargo clippy --locked --manifest-path "$MANIFEST" --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path "$MANIFEST"
      - name: "example: harvest_camel"
        run: cargo run --locked --manifest-path examples/harvest-camel/Cargo.toml
      - name: One version each of camel and autumn-harvest
        run: |
          out=$(cargo tree --locked -e normal -d --manifest-path "$MANIFEST")
          if printf '%s\n' "$out" | grep -E '^(camel-core|camel-api|camel-component-api|autumn-harvest) v'; then
            echo "::error::two versions of a crate above: the types do not match"
            exit 1
          fi
      - name: MSRV 1.89
        run: cargo +1.89.0 check --locked --manifest-path "$MANIFEST" --all-targets

  msrv:
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.89.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.89.0 check --workspace --all-targets --locked

  verus:
    runs-on: ubuntu-latest
    env:
      # Same build as local: Verus from source at a pinned commit, z3 from PyPI.
      VERUS_REV: 2c9bf54cfa6391ee3769f23d8d173b96a0b70560
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/verus-src/source/target-verus
          key: verus-${{ env.VERUS_REV }}
      # Build Verus outside the repo: in the repo, cargo takes it as a
      # member of the San Mateo workspace.
      - name: Build Verus
        run: |
          set -eu
          mkdir -p "$HOME/verus-src" && cd "$HOME/verus-src"
          git init -q
          git fetch -q --depth 1 https://github.com/verus-lang/verus "$VERUS_REV"
          git checkout -q FETCH_HEAD
          pip download -q --no-deps z3-solver==4.16.0.0 -d /tmp/z3
          python3 -m zipfile -e /tmp/z3/*.whl /tmp/z3/x
          cp /tmp/z3/x/z3_solver-4.16.0.0.data/data/bin/z3 source/z3
          chmod +x source/z3
          cd source
          rustup toolchain install
          bash -c 'source ../tools/activate && vargo build --release'
      - name: Verify the policy spec
        run: |
          VERUS_Z3_PATH="$HOME/verus-src/source/z3" \
            "$HOME/verus-src/source/target-verus/release/verus" verus/policy.rs
