[package]
name = "san-mateo-server"
description = "The San Mateo server: the REST API with Postgres, SQLite or memory storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["oauth", "integration", "server", "nango"]
categories = ["web-programming::http-server", "authentication"]

[[bin]]
name = "san-mateo"
path = "src/main.rs"
# The lib `san_mateo` has the same doc path.
doc = false

[dependencies]
san-mateo.workspace = true
san-mateo-postgres = { version = "0.1.0", path = "../san-mateo-postgres" }
san-mateo-sqlite = { version = "0.1.0", path = "../san-mateo-sqlite", optional = true }
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[features]
# `SAN_MATEO_DATABASE_URL=sqlite://<path>` keeps data in one SQLite file. It
# builds SQLite from C source, so it is off by default.
sqlite = ["dep:san-mateo-sqlite"]

[dev-dependencies]
tower.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util"] }

[lints]
workspace = true
