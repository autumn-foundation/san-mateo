[package]
name = "san-mateo-server"
description = "The San Mateo server: the REST API with Postgres or memory storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["oauth", "integration", "server", "nango"]
categories = ["web-programming::http-server", "authentication"]

[[bin]]
name = "san-mateo"
path = "src/main.rs"

[dependencies]
san-mateo.workspace = true
san-mateo-postgres = { version = "0.1.0", path = "../san-mateo-postgres" }
axum.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
tower.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util"] }

[lints]
workspace = true
