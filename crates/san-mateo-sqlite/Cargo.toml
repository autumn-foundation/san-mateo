[package]
name = "san-mateo-sqlite"
description = "SQLite store for San Mateo: one embedded file, no database server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["oauth", "integration", "sqlite", "embedded"]
categories = ["database", "authentication"]

[dependencies]
san-mateo.workspace = true
async-trait.workspace = true
chrono.workspace = true
# The same `libsqlite3-sys` as `autumn-harvest-sqlite` 0.10. The crate has
# `links = "sqlite3"`, so one app can hold only one version.
rusqlite = { version = "0.40", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true

[dev-dependencies]
san-mateo = { workspace = true, features = ["test-support"] }
futures.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
url.workspace = true

[lints]
workspace = true
