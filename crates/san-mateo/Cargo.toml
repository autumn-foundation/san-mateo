[package]
name = "san-mateo"
description = "Integration auth platform: OAuth and API key connections, token refresh, an auth proxy, syncs and actions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["oauth", "integration", "proxy", "nango", "autumn"]
categories = ["authentication", "web-programming", "api-bindings"]
# This test reads files of the repository, not of the crate.
exclude = ["tests/examples_wired.rs"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
aes-gcm.workspace = true
base64.workspace = true
chrono.workspace = true
futures.workspace = true
hex.workspace = true
hmac.workspace = true
http.workspace = true
percent-encoding.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[features]
# Exposes the store conformance suite for other `Store` crates.
test-support = []

# With `test = true`, `cargo test` runs the tests in the example.
[[example]]
name = "embedded"
test = true

[dev-dependencies]
proptest.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[lints]
workspace = true
