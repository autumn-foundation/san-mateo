[package]
name = "autumn-plugin-san-mateo"
description = "San Mateo plugin for autumn-web: OAuth and API key connections, token refresh, an auth proxy, syncs and actions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["autumn", "oauth", "integration", "plugin", "nango"]
categories = ["web-programming", "authentication"]

[dependencies]
san-mateo.workspace = true
# Keep this requirement equal to `AUTUMN_WEB_REQUIREMENT`. A unit test checks it.
autumn-web = { version = "0.8", default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml = "0.9"
tower.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
async-trait.workspace = true
# The `autumn_app` example test makes a random encryption key.
base64.workspace = true
reqwest.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# With `test = true`, `cargo test` runs the tests in the example.
[[example]]
name = "autumn_app"
path = "examples/autumn_app/main.rs"
test = true

[lints]
workspace = true
