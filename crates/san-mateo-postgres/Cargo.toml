[package]
name = "san-mateo-postgres"
description = "Postgres store for San Mateo, with diesel-async and embedded migrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["oauth", "integration", "postgres", "diesel"]
categories = ["database", "authentication"]

[dependencies]
san-mateo.workspace = true
async-trait.workspace = true
chrono.workspace = true
deadpool = { version = "0.13", features = ["rt_tokio_1"] }
diesel = { version = "2.3", default-features = false, features = ["postgres_backend", "chrono", "serde_json", "uuid", "32-column-tables"] }
diesel-async = { version = "0.9", features = ["deadpool", "postgres"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
san-mateo = { workspace = true, features = ["test-support"] }
futures.workspace = true
url.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
